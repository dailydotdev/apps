<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" shape-rendering="crispEdges">
  <!-- QR code for https://r.daily.dev/get?utm_source=header_qr at error
    correction H. Same smart link as the onboarding panel: it redirects by OS
    to the App Store, Google Play, or the extension store. The utm_source
    param reaches our own redirector (api.daily.dev/get), which is what lets
    header scans be distinguished from onboarding scans server-side. It also
    survives onto the Play and Chrome Web Store URLs, but nothing store-side
    consumes it there: Play install referrer reads a referrer param and Apple
    strips query params and only honours its own pt/ct campaign tokens, so
    store-side attribution belongs on the redirector, not in this code.
    A spec (getAppQr.spec.ts) decodes this matrix with jsQR, the way a scanner
    would, and asserts it still says the URL above, so changing either one
    alone fails CI. It also pins the 37 module size, which is what level H
    yields for this URL: the logo knockout budget depends on H, and a weaker
    level would shrink the matrix.
    Regenerate with: npx qrcode -t svg -e H <url>
    and keep ONLY the stroke path plus this viewBox. The white background rect
    the generator adds must be dropped: the SVGR configs rewrite #ffffff to
    currentcolor, which would turn it black; the parent plate supplies the
    white. Note: double hyphens are illegal inside XML comments, so no long
    CLI flags in this note. -->
