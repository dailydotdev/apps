version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24.22.1

commands:
  restore_deps:
    steps:
      - restore_cache:
          keys:
            - deps-pnpm-10-33-4-{{ checksum "pnpm-lock.yaml" }}
            - deps-pnpm-10-33-4-{{ .Branch }}
  # Jest's worker count defaults to the host's core count minus one, which on a
  # Docker executor is the metal underneath, not the container. Pin the workers
  # to the resource class so the suite does not swamp the container.
  jest:
    parameters:
      package:
        type: string
      workers:
        type: integer
        default: 2
      extra_args:
        type: string
        default: ""
    steps:
      - run:
          name: Test
          command: |
            TEST=$(./node_modules/.bin/jest --listTests)
            echo $TEST | circleci tests run --command="xargs ./node_modules/.bin/jest --ci --maxWorkers=<< parameters.workers >> << parameters.extra_args >> --reporters=default --reporters=jest-junit --" --split-by=timings --timings-type=filename
          environment:
            JEST_JUNIT_OUTPUT_DIR: ../../test-results
            JEST_JUNIT_ADD_FILE_ATTRIBUTE: "true"
            JEST_JUNIT_FILE_PATH_PREFIX: /home/circleci/project/packages/<< parameters.package >>/
          working_directory: packages/<< parameters.package >>
      - store_test_results:
          path: ./test-results

jobs:
  install_deps:
    executor: node
    steps:
      - checkout
      - run:
          name: Enable pnpm
          command: |
            mkdir -p $HOME/.local/bin
            corepack enable --install-directory $HOME/.local/bin
            corepack prepare pnpm@10.33.4 --activate
      - restore_deps
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile --prefer-offline
      - save_cache:
          key: deps-pnpm-10-33-4-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ./node_modules
            - ./packages/eslint-rules/node_modules
            - ./packages/shared/node_modules
            - ./packages/webapp/node_modules
            - ./packages/extension/node_modules
            - ./packages/storybook/node_modules
  lint:
    executor: node
    parallelism: 4
    steps:
      - checkout
      - restore_deps
      - run:
          name: Lint
          command: ./scripts/ci-lint.sh
  test_extension:
    executor: node
    parallelism: 1
    steps:
      - checkout
      - restore_deps
      - jest:
          package: extension
  test_webapp:
    executor: node
    resource_class: large
    parallelism: 2
    steps:
      - checkout
      - restore_deps
      - jest:
          package: webapp
          workers: 4
  test_shared:
    executor: node
    resource_class: large
    parallelism: 4
    steps:
      - checkout
      - restore_deps
      - jest:
          package: shared
          workers: 4
          extra_args: --silent
  typecheck_strict_changed:
    executor: node
    resource_class: large
    steps:
      - checkout
      - restore_deps
      # The strict tsconfigs are incremental. Warm the build info from this
      # branch's previous run, or from main, so tsc only re-checks what changed
      # since instead of the whole program.
      - restore_cache:
          keys:
            - tsbuildinfo-v1-{{ .Branch }}-{{ .Revision }}
            - tsbuildinfo-v1-{{ .Branch }}-
            - tsbuildinfo-v1-main-
      - run:
          name: Fetch base branch
          command: git fetch origin main
      - run:
          name: Check changed files in strict mode
          command: npm run typecheck:strict:changed
      - run:
          name: Prepare build info for caching
          command: mkdir -p packages/shared/.tsbuildinfo packages/webapp/.tsbuildinfo packages/extension/.tsbuildinfo
          when: always
      - save_cache:
          key: tsbuildinfo-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ./packages/shared/.tsbuildinfo
            - ./packages/webapp/.tsbuildinfo
            - ./packages/extension/.tsbuildinfo
          when: always
  build_extension:
    executor: node
    resource_class: medium
    steps:
      - checkout
      - restore_deps
      - run:
          name: Build Extension
          command: npm run build
          working_directory: packages/extension
workflows:
  build:
    jobs:
      - install_deps
      - test_extension:
          requires:
            - install_deps
      - test_webapp:
          requires:
            - install_deps
      - lint:
          requires:
            - install_deps
      - typecheck_strict_changed:
          requires:
            - install_deps
      - test_shared:
          requires:
            - install_deps
      - build_extension:
          requires:
            - install_deps
