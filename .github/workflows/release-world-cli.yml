name: release world cli
run-name: "release world cli `${{ github.event.inputs.version }}` version by `@${{ github.actor }}`"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: release-world-cli
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Verify release branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Release from ${DEFAULT_BRANCH}, not ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: chainguard-dev/actions/setup-gitsign@main

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing requires npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @dailydotdev/world-cli...

      - name: Setup git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config tag.gpgsign true

      - name: Bump package versions
        id: version
        env:
          BUMP: ${{ github.event.inputs.version }}
        run: |
          NEXT_VERSION=$(npm version "$BUMP" --no-git-tag-version --prefix packages/world-cli)
          VERSION=${NEXT_VERSION#v}
          npm version "$VERSION" --no-git-tag-version --prefix packages/world-kit
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add packages/world-cli/package.json packages/world-kit/package.json
          git commit --message "chore: release world cli v${VERSION}"
          git tag --sign "world-cli-v${VERSION}" --message "@dailydotdev/world-cli v${VERSION}"

      - name: Pack packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --dir packages/world-kit pack --pack-destination "$RUNNER_TEMP"
          pnpm --dir packages/world-cli pack --pack-destination "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/dailydotdev-world-kit-${VERSION}.tgz"
          test -f "$RUNNER_TEMP/dailydotdev-world-cli-${VERSION}.tgz"

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm publish "$RUNNER_TEMP/dailydotdev-world-kit-${VERSION}.tgz" --access public
          npm publish "$RUNNER_TEMP/dailydotdev-world-cli-${VERSION}.tgz" --access public

      - name: Push release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push --follow-tags
          gh release create "world-cli-v${VERSION}" \
            --generate-notes \
            --title "@dailydotdev/world-cli v${VERSION}"
